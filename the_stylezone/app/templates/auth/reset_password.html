{% extends "base.html" %}

{% block title %}Reset Password | {{ settings.business_name }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container container-narrow" style="max-width: 480px;">
        <div class="card" style="padding: 40px 30px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <span class="section-subtitle">Security</span>
                <h1 style="font-size: 1.8rem;">Set New Password</h1>
            </div>

            {% if success_msg %}
                <div class="alert alert-success">{{ success_msg }}</div>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="/login" class="btn btn-primary">Proceed to Login</a>
                </div>
            {% else %}
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form action="/reset-password" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="token" value="{{ token }}">

                    <div class="form-group">
                        <label class="form-label" for="password">New Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirm_password">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Update Password</button>
                </form>
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}
