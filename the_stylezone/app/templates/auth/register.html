{% extends "base.html" %}

{% block title %}Create Account | {{ settings.business_name }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container container-narrow" style="max-width: 500px;">
        <div class="card" style="padding: 40px 30px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <span class="section-subtitle">New Client</span>
                <h1 style="font-size: 2rem;">Create Account</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Join The Stylezone for instant booking access</p>
            </div>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form action="/register" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="return_to" value="{{ return_to }}">

                <div class="form-group">
                    <label class="form-label" for="full_name">Full Name *</label>
                    <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="rahul@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. 9876543210">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password (min 6 characters) *</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                    Create Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.95rem; color: var(--text-muted);">
                Already have an account? <a href="/login?return_to={{ return_to }}" style="color: var(--gold); font-weight: 600;">Log in here</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
